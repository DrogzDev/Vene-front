<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />

    <!--
      viewport-fit=cover es imprescindible dentro del APK: sin él el
      navegador no expone el recorte de la pantalla y todas las
      env(safe-area-inset-*) devuelven 0, así que la cabecera se mete
      bajo la barra de estado y la navegación inferior bajo la barra de
      gestos de Android.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Pinta la barra de estado del mismo color que el fondo. -->
    <meta name="theme-color" content="#F6F6F4" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Tema antes del primer pintado, para que no parpadee: preferencia
      guardada (src/theme/theme.ts, clave "vc-theme") o, si no hay, la del
      sistema. Solo se resuelve oscuro cuando el sistema lo declara
      explícitamente (prefers-color-scheme: dark) — sin eso (WebViews que
      no exponen la preferencia, o un sistema sin declarar ninguna) el
      tema por defecto es claro, nunca negro por opinión del código.
    -->
    <script>
      (function () {
        var theme = "light"
        try {
          var stored = localStorage.getItem("vc-theme")
          if (stored === "dark" || stored === "light") theme = stored
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute("content", theme === "light" ? "#F6F6F4" : "#050607")
      })()
    </script>

    <title>Venecambio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
